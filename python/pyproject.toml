# Nervus IPC v1 —— Python SDK 打包定义。
#
# 只打包手写的 `nervus_ipc` 包（在本目录 sdk 下）。生成的 protobuf 类型在**兄弟目录**
# `../protocol`（buf `out`，PEP 420 命名空间包，clean 会整目录删，故不并入本包源树）。
# 运行期 `nervus_ipc/__init__.py` 的 bootstrap 会在仓库布局下把 `../protocol` 挂上
# sys.path（editable 安装 `pip install -e .` 源码原地，bootstrap 依然生效）。
# 非 editable 安装 / 打分发包时，请把 `python/protocol` 一并置于 PYTHONPATH 或按需
# 生成——详见 README「安装与运行」。

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nervus-ipc-sdk"
version = "0.1.0"
description = "Nervus OS 控制面 IPC v1 —— Python client + ServiceHost（复用冻结 proto 生成的 protobuf）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# protoc 29.3 生成的 _pb2 需要 protobuf runtime >= 5.29（与 go/jvm 侧版本对齐）。
dependencies = ["protobuf>=5.29,<6"]

[tool.setuptools.packages.find]
where = ["sdk"]
include = ["nervus_ipc*"]

[tool.pytest.ini_options]
testpaths = ["sdk/tests"]
