// Nervus 标准接口 · PackageManager@1  [REWRITE-v1 / experimental]
//
// [KERNEL: WIRED] nervud 支持本接口所需的全部机制（Request/Response、
// Dispatch/DispatchResult、endpoint 注册与路由）。接口级权限以 perm.pkg.query
// 保护解析与只读查询；每次路由还会叠加 method 级 required_permission，因此
// 安装、卸载和启停组件仍需 perm.pkg.install。
//
// interface_id = nervus.interface.pkg.manager ，major = 1，experimental。
//   实现者    = nervus.pkgmanagerd（系统服务，nervus-system-server 仓库）
//   Permission = perm.pkg.install / .query
//
// # 它为什么必须是一个 Interface 而不是内核直接开的口
//
// 装包的权威通道是 nervud 的 root-only 管理通道（nervud-admin.sock）。App 不
// 可能是 root，连不上那条 socket。于是需要一个跑在 App UID 段、被内核显式放行
// 的系统服务替 App 转发——而 App 与那个服务之间的契约，就是本接口。
//
// 分工必须记清楚：本接口的实现者【不做任何安全判定】。多角色验签、digest 复核、
// OEM 副署准入、Host ABI 匹配、升级裁决（防降级 + 签名血统连续性）、权限交集、
// UID 分配、原子提交，全部在 nervud 的 pkgregistry 里。Provider 只是把请求
// 投递过去、把结果读回来。
//
// # 风险级为什么不是 PHYSICAL_CONTROL
//
// 装包不驱动执行器，机器不会因此动起来，所以 is_motion = false、
// risk_class 也不是 PHYSICAL_CONTROL。但它【绝不是】NORMAL：装一个包等于往
// 系统里引入新的可执行代码与新的权限请求，后果的持久性远超一次运动指令。
// 因此 Install/Uninstall 取 RISK_CLASS_CRITICAL_SAFETY 并要求用户确认——
// 这是本接口与运动类接口在风险模型上的根本差异。
//
// [REWRITE-v1] experimental：冻结前允许破坏性调整（NRCP §22.6）。
// 兼容规则（§10.12，冻结后生效）：已发布 method_id 与字段号永不复用；
// 删除写 reserved；新增字段须有安全默认；枚举以 *_UNSPECIFIED = 0 起始并 fail closed。

syntax = "proto3";

package nervus.interface.pkgmanager.v1;

import "nervus/ipc/v1/method_registry.proto";
// LocalizedText：Inspect 回给确认屏的权限文案。文案由内核从 Catalog 的权限
// 定义里取，界面不自己写死——第三方包可以定义自己的权限，界面不可能预先
// 知道它们的名称与说明。
import "nervus/ipc/v1/provider_descriptor.proto";

option go_package = "github.com/nervus-os/nervus-ipc/protocol/interface/pkgmanagerv1;pkgmanagerv1";

// 连字符在 Java 包名里非法，理由见 status.proto。
option java_package = "io.github.nervusos.iface.pkgmanager.v1";
option java_multiple_files = true;
option java_outer_classname = "PackageManagerProto";

// =============================================================================
// method_id 枚举 + Method Registry 元数据
// =============================================================================

enum PackageManagerMethod {
  PACKAGE_MANAGER_METHOD_UNSPECIFIED = 0;

  // 安装一个 .nspkg。
  //
  // 【长任务】：解包 + 全量 digest 复核可能耗时可观（一个大包几十 MiB），
  // 远超普通 request/response 的 deadline 预算。因此 returns_operation = true，
  // 以 ACCEPTED + operation_id 应答，终态另行查询。
  //
  // needs_user_confirmation = true：往系统里装新的可执行代码，必须由【系统持有的】
  // 确认框把关。Agent 只能请求，不能自行确认（Agent 文档 §4.3）。
  PACKAGE_MANAGER_METHOD_INSTALL = 1 [(nervus.ipc.v1.method_meta) = {
    method_id: 1
    required_permission: "perm.pkg.install"
    risk_class: RISK_CLASS_CRITICAL_SAFETY
    requires_control_lease: false
    returns_operation: true
    needs_user_confirmation: true
    is_read_only: false
    is_motion: false
    request_type: "nervus.interface.pkgmanager.v1.InstallRequest"
    response_type: "nervus.interface.pkgmanager.v1.InstallResult"
    error_detail_type: "nervus.interface.pkgmanager.v1.PackageManagerErrorDetail"
  }];

  // 卸载一个动态安装的 Package。
  //
  // 系统镜像包卸载不了——nervud 以 ErrSystemPackageImmutable 拒绝（它们跟随
  // 整镜像 OTA）。Provider 不预判，直接转发，让拒绝原因由 nervud 给出。
  //
  // 不是 operation：卸载是停组件 + 删目录 + 撤权，在正常量级下很快。
  PACKAGE_MANAGER_METHOD_UNINSTALL = 2 [(nervus.ipc.v1.method_meta) = {
    method_id: 2
    required_permission: "perm.pkg.install"
    risk_class: RISK_CLASS_CRITICAL_SAFETY
    requires_control_lease: false
    returns_operation: false
    needs_user_confirmation: true
    is_read_only: false
    is_motion: false
    request_type: "nervus.interface.pkgmanager.v1.UninstallRequest"
    response_type: ""
    error_detail_type: "nervus.interface.pkgmanager.v1.PackageManagerErrorDetail"
  }];

  // 列出已装 Package。只读，不需要确认框。
  PACKAGE_MANAGER_METHOD_LIST = 3 [(nervus.ipc.v1.method_meta) = {
    method_id: 3
    required_permission: "perm.pkg.query"
    risk_class: RISK_CLASS_NORMAL
    requires_control_lease: false
    returns_operation: false
    needs_user_confirmation: false
    is_read_only: true
    is_motion: false
    request_type: "nervus.interface.pkgmanager.v1.ListRequest"
    response_type: "nervus.interface.pkgmanager.v1.ListResult"
    error_detail_type: "nervus.interface.pkgmanager.v1.PackageManagerErrorDetail"
  }];

  // 停用/启用一个 Component。
  //
  // 保护名单里的组件（pkgmanagerd 自己、settings、permissionui、sessiond、
  // safety.recovery）停不掉——那条底线在内核的编译期 switch 里，不由 Provider
  // 判断。停用它们会让系统失去自我修复能力。
  PACKAGE_MANAGER_METHOD_SET_COMPONENT_ENABLED = 4 [(nervus.ipc.v1.method_meta) = {
    method_id: 4
    required_permission: "perm.pkg.install"
    risk_class: RISK_CLASS_CRITICAL_SAFETY
    requires_control_lease: false
    returns_operation: false
    needs_user_confirmation: true
    is_read_only: false
    is_motion: false
    request_type: "nervus.interface.pkgmanager.v1.SetComponentEnabledRequest"
    response_type: ""
    error_detail_type: "nervus.interface.pkgmanager.v1.PackageManagerErrorDetail"
  }];

  // 读一个【尚未安装】的 .nspkg，回它的身份与它申请的敏感权限。
  //
  // # 它补的是什么缺口
  //
  // 安装确认屏必须在装之前把「这个包要用摄像头和麦克风」摊给用户看。但包还没
  // 装，它就不在 Catalog 里：permission.admin 的 ListGrants 与本接口的 LIST
  // 都只覆盖【已装】包，谁都答不出一个待装包申请了什么。
  //
  // # 为什么这件事必须由内核做而不是确认屏自己读
  //
  // 确认屏持有 perm.permission.admin，是全系统唯一能改授予状态的进程。让它去
  // 解 tar、解析一份【尚未验签】的 manifest、再查权限定义表，等于把不受信内容
  // 的解析器放进权限最高的那个进程里——攻击面上最不该放解析器的位置。
  //
  // nervud 为了 INSTALL 本来就要解包、验签、按 Catalog 裁决权限。把那批已经
  // 解析好的事实读出来是顺手的，而解析始终留在内核一侧。
  //
  // # 只读到什么程度
  //
  // 【不落任何状态】：不注册 Entry、不分配 UID、不改 Catalog、不建 staging 之外
  // 的任何东西。同一个包可以 INSPECT 任意多次，结果相同。
  //
  // 权限取 perm.pkg.query 而不是 perm.pkg.install：读一个包申请了什么，与有权
  // 安装它是两件事。设置类应用可以据此展示「这个包要什么权限」而不必具备装包
  // 能力。
  //
  // 不是 operation：解包与验签有成本，但它【不等人】——没有用户交互，普通
  // deadline 足够。这与 permission.ui 的 ConfirmInstall 正相反，那个要等用户
  // 读完清单再点。
  PACKAGE_MANAGER_METHOD_INSPECT = 5 [(nervus.ipc.v1.method_meta) = {
    method_id: 5
    required_permission: "perm.pkg.query"
    risk_class: RISK_CLASS_NORMAL
    requires_control_lease: false
    returns_operation: false
    needs_user_confirmation: false
    is_read_only: true
    is_motion: false
    request_type: "nervus.interface.pkgmanager.v1.InspectRequest"
    response_type: "nervus.interface.pkgmanager.v1.InspectResult"
    error_detail_type: "nervus.interface.pkgmanager.v1.PackageManagerErrorDetail"
  }];
}

// =============================================================================
// 消息
// =============================================================================

// InstallRequest 请求安装一个 .nspkg。
message InstallRequest {
  // .nspkg 在【用户文档区】(user-data) 中的相对路径。
  //
  // # 交接目录是 user-data，不是调用方的私有目录
  //
  // 此前这里写的是"调用方私有数据目录"，而那是错的：每个包的私有目录是 0700、
  // 属主为该包 UID，Provider 读不进去。于是协议与实现指的是两个不同的地方，
  // 【任何 App 发起的安装都不可能成功】——调用方能写的位置 Provider 读不到，
  // Provider 能读的位置调用方写不进。
  //
  // 用 user-data 而不是新造一个专用交接目录：它已经是"跨包共享的用户文件"
  // 那块地，用户下载或拷进来的 .nspkg 本来就落在这里，文件管理器也在这里。
  // 再造一个只会多出一次纯粹的复制，换不来任何隔离（两者都全系统可读）。
  //
  // 【刻意不是绝对路径】。绝对路径等于让调用方指定文件系统上任意位置，而
  // Provider 跑在 ProtectSystem=strict 的沙箱里，一个它读不到的绝对路径只会
  // 得到含义模糊的"打不开"。相对路径把交接位置写进协议本身。
  //
  // 必须是不含 ".." 的相对路径；Provider 与 nervud 都会再校验一次。
  string nspkg_relpath = 1;

  // 用户在安装确认屏上同意的敏感权限 ID 列表。
  //
  // # 它解决的是什么
  //
  // USER_CONSENT 权限（perm.camera.capture 一类）在安装期能进
  // GrantedPermissions，但运行期 AllowedAt 要求 GrantState == GRANTED，默认是
  // NOT_REQUESTED。也就是说一个普通应用装上之后，它申请的敏感权限【永远】拿
  // 不到——应用无法自救（SDK 没有请求权限的 API），用户也没有界面可批。本字段
  // 让安装动作把这一问补上：装之前先把该包申请的敏感权限摊给用户看，用户同意
  // 哪些，安装成功后那些权限的运行期状态就直接落成 GRANTED。
  //
  // # 谁有资格填它
  //
  // 【只有系统的确认界面】。经 IPC 装包必须穿过 nervus.interface.permission.ui
  // 的 ConfirmInstall：INSTALL 的 needs_user_confirmation 是 true，而 nervud 的
  // 那道门只对持有 perm.permission.admin 的调用方放行，全系统只有
  // nervus.permissionui 持有它。因此普通应用填不进来——它连 INSTALL 都调不到。
  //
  // # 内核还会再过滤一遍
  //
  // nervud 只对【同意清单 ∩ 安装期授予集合 ∩ USER_CONSENT】三者的交集落库，
  // 越界的条目静默忽略：一条没申请过的、或不是 USER_CONSENT 的权限出现在这里，
  // 不该因为确认界面写错就变成一次真实授予。因此本字段是「用户同意了什么」的
  // 陈述，不是「请授予什么」的命令。
  repeated string consented_permissions = 2;
  // 确认屏那次 INSPECT 回的 InspectResult.manifest_digest，原样回传。
  //
  // # 它关的是"看的是 A、装的是 B"
  //
  // .nspkg 放在跨包共享的 user-data 里，因此调用方在 INSPECT 与 INSTALL
  // 【之间】完全可以把文件换掉。两次调用各自都合法，单看任何一次都发现不了
  // ——而用户是基于 A 的权限清单点的头，consented_permissions 却会被用到 B 上。
  //
  // 带上它，内核会比对；不符即拒（PACKAGE_MANAGER_REASON_CONTENT_CHANGED）。
  //
  // 【为空表示不校验】。必须允许为空：系统装机脚本与 deploy 直接装包，从来没有
  // INSPECT 那一步，强制要求会把它们全部打断。凡是先给用户看过权限清单的
  // 调用方都【必须】带上它，否则那次确认没有约束力。
  string expected_manifest_digest = 3;
}

// InstallResult 是安装成功的终态（operation 的 result）。
message InstallResult {
  PackageInfo package = 1;
}

// UninstallRequest 请求卸载。
message UninstallRequest {
  string package_id = 1;
}

// ListRequest 请求已装 Package 列表。
//
// 空消息而不是省略请求体：将来要加过滤条件（只看用户装的、只看某来源）时
// 有地方放，不必新增一个 method_id。
message ListRequest {}

// ListResult 是已装 Package 的投影。
message ListResult {
  repeated PackageInfo packages = 1;
}

// SetComponentEnabledRequest 停用/启用一个 Component。
message SetComponentEnabledRequest {
  string package_id = 1;
  string component_id = 2;
  bool enabled = 3;
}

// InspectRequest 请求读出一个【尚未安装】的 .nspkg 声明了什么。
message InspectRequest {
  // .nspkg 的相对路径。语义与 InstallRequest.nspkg_relpath 完全一致，
  // 校验也一致（不含 ".."、非绝对路径）。
  //
  // 【刻意与 InstallRequest 用同一个交接约定】：确认屏先 Inspect 再 Install，
  // 两次指的必须是同一个文件。若两者的路径语义不同，中间就出现一个「看的是
  // A、装的是 B」的缝——而用户看到的权限清单来自 A。
  string nspkg_relpath = 1;
}

// InspectResult 是一个待装包的【只读声明投影】。
//
// # 它为什么必须由内核给出
//
// 唯一知道「这个包申请了什么」的地方是包内的 manifest，而它在验签之前是
// 不受信内容。让确认屏自己解包、解析 manifest、再查权限定义表，等于把一个
// 不受信内容的解析器放进持有 perm.permission.admin 的进程里——那是全系统
// 最不该放解析器的地方。
//
// 装包路径上 nervud 本来就要解包验签，把「解析后的声明」读出来是顺手的事。
//
// # 它不是安装裁决的预演
//
// 本方法【不回答「这个包能不能装」】：签名、digest、ABI、防降级、权限交集
// 都在 Install 那一侧裁决，而那些裁决依赖的状态（已装版本、签名血统）可能在
// Inspect 与 Install 之间变化。把裁决结果提前给出去，会让调用方以为
// 「Inspect 通过 = Install 会成功」，而那不成立。
message InspectResult {
  // 包自称的身份。来自 manifest，【已通过验签】但尚未经过安装裁决。
  string package_id = 1;
  string version = 2;
  uint64 version_code = 3;

  // 本包申请的、需要用户点头的敏感权限。
  //
  // 【已由内核过滤成 USER_CONSENT 这一档】：其它授予模式没有「要不要同意」
  // 这回事——NORMAL 装上即生效，PRIVILEGED / SYSTEM_ONLY 由来源与签名决定。
  // 把它们混进来只会让确认屏显示一堆用户无从选择的条目。
  //
  // 空列表是常见且正常的：一个不申请任何敏感权限的包，确认屏只需要问
  // 「装不装」。
  repeated RequestedPermission consent_permissions = 4;
  // 本次检视到的内容的摘要，供 INSTALL 绑定用。
  //
  // 确认屏【必须】把它原样放进 InstallRequest.expected_manifest_digest：
  // 否则用户看到的权限清单与真正装进去的包可能不是同一份，而中间那次替换
  // 不留任何痕迹。
  //
  // 是 sha256(manifest 原始字节) 的十六进制串。manifest 里含全部文件的
  // digests 且自身被签名覆盖，因此它等价于整包内容的标识——不需要遍历文件树。
  string manifest_digest = 5;
}

// RequestedPermission 是待装包申请的一条敏感权限。
//
// 与 permission.v1.PermissionGrant 形状刻意一致（ID + 中英文案 + 风险级），
// 差别只是这里【没有 state】：包还没装，也就还没有运行期授予状态可言。
// 形状一致让确认屏与权限管理屏能共用同一套渲染逻辑。
message RequestedPermission {
  string permission_id = 1;

  // 面向用户的名称与说明，来自 Catalog 的权限定义。
  //
  // 【由内核给出而不是界面自己写死】：第三方包可以定义自己的权限，
  // 界面不可能预先知道它们的文案。
  nervus.ipc.v1.LocalizedText display_name = 2;
  nervus.ipc.v1.LocalizedText description = 3;

  nervus.ipc.v1.RiskClass risk_class = 4;
}

// PackageInfo 是一个已装 Package 的【对外投影】。
//
// 刻意不含：安装路径、UID、签名密钥、digest 清单。这些是内核的内部状态，
// 泄漏出去除了帮助攻击者定位目标之外没有用处（对照 ResolveEndpointSuccess
// 的 resource_handle：不含 Provider PID、设备节点、序列号）。
message PackageInfo {
  string package_id = 1;
  string version = 2;
  uint64 version_code = 3;

  // 信任 profile 的字符串投影（ordinary / oem / platform）。
  // 用字符串而不是复用 ipcv1.TrustProfile 枚举：这是给 UI 展示的，
  // 不参与任何裁决，不值得为它在接口层引入对控制面枚举的依赖。
  string trust = 4;

  // 来源：system-image / dynamic-install。
  string source = 5;

  // 已授予的权限 ID 列表，供 UI 展示。是 nervud 裁决结果的只读投影。
  repeated string granted_permissions = 6;

  // 已停用的 Component ID 列表。
  repeated string disabled_components = 7;
}

// =============================================================================
// 错误细因
// =============================================================================

// PackageManagerErrorDetail 是本接口失败时的固定 detail 类型。
//
// 为什么需要它：装包失败的原因对用户【是有意义的】——签名不对、版本降级、
// ABI 不匹配、包已存在，这四种的正确反应完全不同（换个包 / 别装旧版 /
// 换个架构的包 / 先卸载）。笼统一个 FAILED_PRECONDITION 会让 UI 只能显示
// 「安装失败」，把排查成本全推给用户。
message PackageManagerErrorDetail {
  PackageManagerReason reason = 1;
}

enum PackageManagerReason {
  // fail closed：未知原因按最保守处理（不重试、提示联系发布者）。
  PACKAGE_MANAGER_REASON_UNSPECIFIED = 0;

  // 签名验证失败或缺少必需的签名角色（动态安装必须有 developer 签名）。
  PACKAGE_MANAGER_REASON_SIGNATURE_INVALID = 1;

  // digest 复核不通过：包内容与 manifest 声明不符（损坏或被篡改）。
  PACKAGE_MANAGER_REASON_DIGEST_MISMATCH = 2;

  // version_code 不高于已装版本，防降级裁决拒绝。
  PACKAGE_MANAGER_REASON_DOWNGRADE = 3;

  // 包的 supported_abis 与本机 ABI 无交集。
  PACKAGE_MANAGER_REASON_ABI_MISMATCH = 4;

  // manifest 结构不合法（schema 版本、必填字段、路径逃逸等）。
  PACKAGE_MANAGER_REASON_MANIFEST_INVALID = 5;

  // 目标 Package 不存在（卸载/停用时）。
  PACKAGE_MANAGER_REASON_PACKAGE_NOT_FOUND = 6;

  // 系统镜像包不可卸载，或该 Component 在保护名单里不可停用。
  PACKAGE_MANAGER_REASON_IMMUTABLE = 7;

  // 升级时签名血统不连续：新包不是同一开发者（或其授权继任密钥）签的。
  // 这条挡的是「用同名包劫持已装应用身份」。
  PACKAGE_MANAGER_REASON_LINEAGE_BROKEN = 8;

  // 解包失败：压缩格式错误，或条目试图逃出目标目录（tar-slip）。
  PACKAGE_MANAGER_REASON_ARCHIVE_INVALID = 9;

  // 包内容在用户确认之后被换过：expected_manifest_digest 与实际不符。
  //
  // 【与 DIGEST_MISMATCH 是两件事】。那条是"包坏了或被篡改"（内容与自己的
  // manifest 声明不符）；这条的包可能完全有效、签名正确，只是它不是确认屏
  // 摊给用户看的那一份。前者提示用户重新下载，后者必须重新走一次确认——
  // 混成一条会让界面给出错误的补救建议。
  PACKAGE_MANAGER_REASON_CONTENT_CHANGED = 10;
}
