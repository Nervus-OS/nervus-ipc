// nervus.interface.transfer.control@1
//
// 这是 nervud 实现的系统 Interface。Provider 在处理一个已获准的 Dispatch 时，
// 用 origin_route_id 准备数据通道；普通 App 不能凭空创建 Transfer。
//
// BeginTransfer 必须从【收到该 Dispatch 的同一条 ServiceHost 控制连接】发起。
// route_id 是连接作用域句柄，另开 Client 连接后即使进程身份相同也不得复用。

syntax = "proto3";

package nervus.interface.transfer.v1;

import "nervus/ipc/v1/method_registry.proto";
import "nervus/ipc/v1/transfer.proto";

option go_package = "github.com/nervus-os/nervus-ipc/protocol/interface/transferv1;transferv1";

option java_package = "io.github.nervusos.iface.transfer.v1";
option java_multiple_files = true;
option java_outer_classname = "TransferControlProto";

enum TransferControlMethod {
  TRANSFER_CONTROL_METHOD_UNSPECIFIED = 0;

  TRANSFER_CONTROL_METHOD_BEGIN_TRANSFER = 1 [
    (nervus.ipc.v1.method_meta) = {
      method_id: 1
      risk_class: RISK_CLASS_NORMAL
      request_type: "nervus.interface.transfer.v1.BeginTransferRequest"
      response_type: "nervus.interface.transfer.v1.BeginTransferResponse"
      is_read_only: false
      default_timeout_ms: 1000
      max_timeout_ms: 3000
      max_request_bytes: 4096
      max_response_bytes: 4096
    }
  ];

  TRANSFER_CONTROL_METHOD_COMMIT_TRANSFER = 2 [
    (nervus.ipc.v1.method_meta) = {
      method_id: 2
      risk_class: RISK_CLASS_NORMAL
      request_type: "nervus.interface.transfer.v1.CommitTransferRequest"
      response_type: "nervus.interface.transfer.v1.CommitTransferResponse"
      is_read_only: false
      default_timeout_ms: 1000
      max_timeout_ms: 3000
      max_request_bytes: 1024
      max_response_bytes: 1024
    }
  ];

  TRANSFER_CONTROL_METHOD_ABORT_TRANSFER = 3 [
    (nervus.ipc.v1.method_meta) = {
      method_id: 3
      risk_class: RISK_CLASS_NORMAL
      request_type: "nervus.interface.transfer.v1.AbortTransferRequest"
      response_type: "nervus.interface.transfer.v1.AbortTransferResponse"
      is_read_only: false
      default_timeout_ms: 1000
      max_timeout_ms: 3000
      max_request_bytes: 1024
      max_response_bytes: 1024
    }
  ];
}

message BeginTransferRequest {
  // 当前 Provider 正在处理的 Dispatch.route_id。
  uint64 origin_route_id = 1;
  nervus.ipc.v1.TransferDirection direction = 2;
  // UNSPECIFIED 表示让 nervud 从 MethodMeta.transfer.allowed_modes 选择基线模式。
  nervus.ipc.v1.TransferMode preferred_mode = 3;
  // 0 表示使用 MethodMeta / 内核保守默认值，不表示无限。
  uint32 requested_max_packet_bytes = 4;
  uint64 requested_bytes_per_second = 5;
}

message BeginTransferResponse {
  // Provider 自己使用，禁止塞进业务响应交给调用方。
  nervus.ipc.v1.TransferHandle provider = 1;

  // 嵌入 Camera/Microphone 等能力接口的 OpenStream 响应。
  nervus.ipc.v1.TransferHandle caller = 2;
}

message CommitTransferRequest {
  // BeginTransfer 先创建 PREPARED Transfer。Provider 完成自身附着、并确定业务
  // OpenStream 响应能够成功返回后再 Commit；Commit 后 caller ticket 才可附着。
  // 同一 transfer_id 的重复 Commit 必须幂等。
  bytes transfer_id = 1;
}

message CommitTransferResponse {}

message AbortTransferRequest {
  // 放弃 PREPARED Transfer。handler 失败、route 被取消或连接断开时 nervud 也必须
  // 自动 Abort；重复 Abort 必须幂等。
  bytes transfer_id = 1;
}

message AbortTransferResponse {}
