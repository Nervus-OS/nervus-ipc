// Nervus IPC v1 —— 通用 Method Registry 机制  [REWRITE-v1 / experimental]
//
// [KERNEL: NOT WIRED] nervud 尚未从 descriptor 抽取 Method Registry——方法级
// 权限判定还没接（internal/endpoint 目前只做到 interface 粒度，见其 catalog.go）。
// 抽取代码本身已在 go/registry.ExtractMethodMetas 并有测试，缺的是内核侧接线。
//
// 本文件定义一套【与具体接口无关】的机制：把每个 method 的元数据
// （权限 / 风险级 / 是否需 ControlLease / 是否 operation / 是否需用户确认 /
// 请求响应消息类型）用 protobuf【自定义 option】挂在该接口的 method_id
// 枚举值上。一次 `buf generate`，这些元数据对 Go / Java / Kotlin 三语言同时
// 可见；nervud 与各 SDK 从生成的 descriptor 里【只读抽取】出 Method Registry，
// 而不是在各自语言里另抄一份清单。
//
// 为什么长在 proto 里（`00` 红线 #3/#4，NRCP §22.6）：
//   proto 是唯一 wire 真源。method_id → 权限/是否 operation 这类【清单】若写成
//   nervud 的编译期 Go 常量表，就等于把「加一个方法 / 加一个 OEM 接口」变成
//   「改内核、重编 nervud」。把清单挂在 option 上、由 descriptor 驱动，才能做到
//   ——OEM 只在自己的 .proto 挂 option，nervud 一行 Go 都不用改，新方法/新接口
//   就自动进 Registry（B1 dispatch 据此做 method 级权限 + operation 判定）。
//
// 自检：OEM 加一个 operation-returning 方法，要不要改 nervus-ipc 之外的代码？
//   ——不应该。只在它自己的 .proto 定义 method_id 枚举值并挂 (method_meta)。
//
// [REWRITE-v1] experimental：冻结前允许破坏性调整。扩展号 60001 一经发布
// 【永不改动、永不复用】——它是三语言 option 抽取的锚点，改了等于让所有已
// 生成代码里的 method_meta 失联。

syntax = "proto3";

package nervus.ipc.v1;

// 自定义 option 必须扩展 descriptor.proto 里的 EnumValueOptions。
// 这是 protoc 的【内置】well-known 类型，buf / protoc 自带，无需第三方依赖，
// 也不触碰任何在线服务（NRCP：不依赖 Google 在线服务的红线）。
import "google/protobuf/descriptor.proto";

option go_package = "github.com/nervus-os/nervus-ipc/go/protocol/ipcv1;ipcv1";

// 连字符在 Java 包名里非法，理由见 status.proto。
option java_package = "io.github.nervusos.ipc.v1";
option java_multiple_files = true;
option java_outer_classname = "MethodRegistryProto";

// =============================================================================
// 风险级（Agent 工具元数据 + Resource 保护级共用，NRCP §9 / A4）
// =============================================================================

// RiskClass 是方法/资源的物理与隐私风险级别。它同时服务两个消费者：
//   1. Method Registry 的 method_meta.risk_class —— 逐方法的风险，喂给
//      Agent 工具目录与系统确认框决策（危险动作 Agent 只能请求，确认框由
//      系统持有，`00` 红线 #6）。
//   2. A4 的 ProviderDescriptor（ManagedResource.risk_class /
//      ProvidedInterface.resource_risk_floor）—— 接口/资源级的最低保护级。
//
// 因此它定义在这个【机制层】文件里，供接口 schema 与 Provider Descriptor 共同
// import，而不是塞进某一个具体接口。
//
// 所有枚举以 *_UNSPECIFIED = 0 起始并 fail closed：未知/漏填一律按「最保守」
// 处理（调用方不得把 UNSPECIFIED 当作 NORMAL 放行）。
enum RiskClass {
  RISK_CLASS_UNSPECIFIED = 0;
  // 只读或无物理/隐私副作用（如 GetState / Subscribe）。
  RISK_CLASS_NORMAL = 1;
  // 触及隐私敏感数据（如麦克风/摄像头原始流）。
  RISK_CLASS_PRIVACY_SENSITIVE = 2;
  // 驱动物理执行器（如运动/机械臂/夹爪）。危险动作，Agent 需系统确认框。
  RISK_CLASS_PHYSICAL_CONTROL = 3;
  // 触及安全关键路径（Safety re-arm 等）。最高风险。
  RISK_CLASS_CRITICAL_SAFETY = 4;
}

// =============================================================================
// Method 元数据
// =============================================================================

// MethodMeta 是挂在【某个接口的 method_id 枚举值】上的元数据。
//
// 真相源永远是 proto：Go / SDK / Agent 只从生成的 EnumValueOptions 里读它，
// 不在别处另写清单。字段一经发布遵循 §10.12 兼容规则（号不复用、删除写
// reserved、新增字段须有安全默认）。
message MethodMeta {
  // 稳定的数字 method_id，进 Request.method_id / Dispatch.method_id。
  //
  // 【必须等于所在枚举值的数字值】——枚举值本身承载 wire 上的 method_id，
  // 这里冗余一份是为了让「只拿到一条 MethodMeta」的消费者也自带 id，不必
  // 回查枚举。抽取工具会校验两者一致，不一致即 schema 错误。
  uint32 method_id = 1;

  // 调用该方法所需的 Permission id（如 nervus.permission.manipulator.control）。
  // 空 = 接口级 Resolve 已足够，method 级不再额外要权限（如只读状态查询）。
  //
  // 这是 method 级权限的【真相源】：B1 dispatch 据此在转发前做 method 级裁决。
  string required_permission = 2;

  // 该方法的风险级，喂给 Agent 工具目录与系统确认框（见 RiskClass 注释）。
  RiskClass risk_class = 3;

  // 是否要求调用方持有该 Resource 的 ControlLease 才能调用。
  // 只读方法为 false；驱动执行器的方法为 true。
  bool requires_control_lease = 4;

  // true → 该方法是长任务，dispatch 走 operation.Create（B5 Operation Manager），
  // 成功以 STATUS_CODE_ACCEPTED + operation_id 应答，终态另行查询/订阅。
  // false → 普通 request/response，成功以 OK 应答。
  bool returns_operation = 5;

  // Agent 工具元数据：调用前是否需要【系统持有的】用户确认框。
  //
  // 危险动作（如机械臂移动）应置 true。Agent Service 的 MCP adapter【只投影
  // 不产生】这个标记，Provider 也【不能自报调低】（Agent 文档 §4.3，A4 §3）。
  bool needs_user_confirmation = 6;

  // 请求消息的 Protobuf 全名，如
  // "nervus.interface.manipulator.v1.MoveToPoseRequest"。
  // SDK/Agent 据此定位请求类型；空表示无请求体（极少见）。
  string request_type = 7;

  // 响应/终态消息的 Protobuf 全名。
  //   returns_operation=false → 普通 Success payload 的类型（可空 = 空 success）
  //   returns_operation=true  → operation 成功 result 的类型
  string response_type = 8;

  // -------- WP-A4 补齐的 Agent 工具元数据（A4 §3）--------
  // A4 要求 method_meta 足以驱动 Agent 工具目录 + 系统确认框决策；needs_user_confirmation
  // / risk_class 之外，Agent/UI 还需要「这个工具会不会改状态、会不会让机器人动起来」
  // 的直接标记。二者与 risk_class 冗余但语义更细，真相源同样在此，Provider 不能自报调低。

  // 是否为只读方法（不改任何状态、无副作用）。Agent 工具目录据此把「安全查询」
  // 与「有副作用的动作」分开呈现给模型；GetXxxState / SubscribeXxx 为 true。
  bool is_read_only = 9;

  // 是否会驱动执行器产生物理运动。供 Agent/确认框/UI 对「会不会动起来」做快速判断。
  // 通常与 risk_class = RISK_CLASS_PHYSICAL_CONTROL 同现，但把它显式化避免消费者
  // 反推风险级。
  bool is_motion = 10;
}

// method_meta 是挂在 EnumValueOptions 上的扩展 option。
//
// 扩展号 60001 落在 protobuf 自定义扩展的私有区间（50000–99999），不与任何
// 公开注册的扩展冲突。【冻结后永不改动此号】——见文件头说明。
extend google.protobuf.EnumValueOptions {
  MethodMeta method_meta = 60001;
}
